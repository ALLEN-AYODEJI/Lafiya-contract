[package]
name = "lafiya-qr"
version = "0.1.0"
edition = "2021"
description = "Lafiya QR payload v1 encoder/decoder — compact, versioned, network-scoped card reference"
license = "MIT"
repository = "https://github.com/Lafiya-xyz/Lafiya-contract"

[features]
default = []
# Enables the physical robustness harness (synthetic degradation pipeline).
# Kept optional so the core encoder/decoder stays dependency-light.
robustness = ["dep:rqrr", "dep:rand", "dep:rand_chacha", "dep:image", "dep:jpeg-decoder"]

[dependencies]
sha2 = "0.10"

[dev-dependencies]
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Open-source QR decoder used to measure decode success.
rqrr = { version = "0.7", optional = true }
# Seeded RNG for deterministic degradation.
rand = { version = "0.8", optional = true }
rand_chacha = { version = "0.3", optional = true }
# Image helpers for blur/perspective/noise/occlusion/JPEG pipeline.
image = { version = "0.24", default-features = false, features = ["jpeg"], optional = true }
jpeg-decoder = { version = "0.3", optional = true }