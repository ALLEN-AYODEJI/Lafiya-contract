# Example lafiya-watchdog configuration. See docs/runbooks/watchdog.md.
rpc_url = "https://soroban-testnet.stellar.org"
contracts = [
  # attester-registry, attestation-registry, multisig-account
]
poll_interval_secs = 5
explorer_tx_url = "https://stellar.expert/explorer/testnet/tx/"
# Upgrades to any wasm hash not listed in these manifests are critical.
release_manifests = ["../../docs/release-manifest/examples/v0.1.0-dev.json"]
known_wasm_hashes = []

# Omit [[rules]] entirely to use the built-in defaults (admin transfer,
# upgrade, repoint, multisig changes -> critical; pause/unpause -> high).
[[rules]]
kind = "admin_transferred"
events = ["admin_transferred"]
severity = "critical"

[[rules]]
kind = "upgraded"
events = ["upgraded"]
severity = "critical"

[[rules]]
kind = "attester_registry_repointed"
events = ["attester_registry_repointed"]
severity = "critical"

[[rules]]
kind = "multisig_reconfigured"
events = ["multisig_*", "signers_*", "threshold_*", "recovery_*"]
severity = "critical"

[[rules]]
kind = "pause_toggled"
events = ["paused", "unpaused"]
severity = "high"

[mass_enrollment]
event = "attester_added"
max_count = 10
window_ledgers = 100
severity = "high"

[heartbeat]
max_lag_ledgers = 60
max_consecutive_failures = 5
# ping_url = "https://hc-ping.com/<uuid>"

# Expiry watchdog for attestation-registry entries (see docs/storage-cost.md).
# Warns when an attestation's TTL horizon falls below the threshold so that
# anyone can permissionlessly bump it via `extend_attestation_ttl`.
[expiry_watch]
# Ledgers remaining before an entry is considered "approaching expiry".
warn_ledgers_remaining = 17280
# Escalate to critical when this close to archival.
critical_ledgers_remaining = 4320
# How often to scan attestation entries, in seconds.
scan_interval_secs = 3600
severity = "high"

# Dispute monitoring for patient-initiated dispute flags (#546).
# Disputes are an overlay; they never delete data and require attester/admin
# action to clear. Alert on new disputes so responders can review them.
[dispute_watch]
# Emit an alert whenever a new dispute is recorded.
alert_on_new_dispute = true
# Alert if a single signer opens more than this many disputes within the window.
max_disputes_per_signer = 5
window_ledgers = 1000
severity = "high"
