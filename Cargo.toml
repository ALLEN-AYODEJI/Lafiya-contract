[workspace]
resolver = "2"
members = [
    "contracts/multisig-account",
    "contracts/attester-registry",
    "contracts/attestation-registry",
    "contracts/incentive-pool",
    "crates/lafiya-config",
    "crates/lafiya-cli",
    "crates/lafiya-commitment",
    "crates/lafiya-contract-common",
    "crates/lafiya-rpc-resilience",
    "crates/lafiya-watchdog",
    "crates/lafiya-fraud-scoring",
    "crates/lafiya-qr",
    "fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Lafiya-xyz/Lafiya-contract"

[workspace.dependencies]
soroban-sdk = "28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.fuzz]
inherits = "release"
debug = 1
debug-assertions = true
overflow-checks = true
panic = "unwind"
strip = "none"
lto = false
codegen-units = 16

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
debug-assertions = false
debug = 0